<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>SED Email Downloader</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
    }
    
    .container {
      text-align: center;
    }
    
    .title {
      color: #323130;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 30px;
    }
    
    #status {
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      background-color: #e7f3ff;
      border: 1px solid #c3e3fd;
      color: #004578;
    }
  </style>
</head>

<body>
  <div id="sideload-msg">Please sideload your add-in to see app body.</div>
  <div id="app-body" style="display:none;">
    <div class="container">
      <div class="title">SED Email Downloader</div>
      <div id="status">Ready to download email...</div>
    </div>
  </div>
  <script src="taskpane.js"></script>
</body>

</html>
